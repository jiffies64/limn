name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      # NVRTC as a wheel: no GPU here, but test_cuda_emit.py compiles every kernel form through it
      - run: uv sync --frozen --extra cuda
      - run: uv run ruff check limn tests
      - run: uv run ruff format --check limn tests
      # pinned: an unpinned pyright can turn a green tree red on a release we did not make
      - run: uvx pyright@1.1.411
      - run: uv run pytest -q
