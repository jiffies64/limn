[project]
name = "limn"
version = "0.1.0"
description = "A small, readable deep learning framework: lazy tensors, autograd, and numpy, C and CUDA backends"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
cuda = [
    "nvidia-cuda-nvrtc>=13.3.33",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "torch>=2.4"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 130

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
